# Deploys the static demo to GitHub Pages. The model files are not in git: they are served from the URL in the
# DECIDER_ASSETS repository variable (a Hugging Face repo, see README "Deploy").
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: web
      - run: node build-pages.mjs --out ../dist --assets "${{ vars.DECIDER_ASSETS }}" --site-only
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/site }
      - id: deployment
        uses: actions/deploy-pages@v4
